name: Build and test platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: darwin-arm64, runner: macos-15}
          - {target: darwin-x64, runner: macos-15-intel}
          - {target: linux-x64, runner: ubuntu-22.04, image: "node:22-bullseye"}
          - {target: linux-arm64, runner: ubuntu-22.04-arm, image: "node:22-bullseye"}
          - {target: alpine-x64, runner: ubuntu-22.04, alpine: true, image: "node:22-alpine"}
          - {target: alpine-arm64, runner: ubuntu-22.04-arm, alpine: true, image: "node:22-alpine"}
          - {target: win32-x64, runner: windows-2022, msvc: x64}
          - {target: win32-arm64, runner: windows-11-arm, msvc: arm64}
    env:
      TGREP_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !matrix.image }}
        with:
          node-version: '22'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          Import-Module "$install\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments "-arch=${{ matrix.msvc }} -host_arch=${{ matrix.msvc }}"
          foreach ($entry in Get-ChildItem Env:) {
            if ($entry.Name -in @('PATH','INCLUDE','LIB','LIBPATH')) {
              "$($entry.Name)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Install development dependencies
        if: ${{ !matrix.image }}
        run: npm ci --ignore-scripts
      - name: Compile and test
        if: ${{ !matrix.image }}
        run: npm test
      - name: Real tgrep and packaged runtime
        if: ${{ !matrix.image }}
        run: |
          node scripts/download-test-tgrep.cjs
          node --test test/integration.cjs
          node scripts/package.cjs
          node test/package.cjs
      - name: Linux native build and tests
        if: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e TGREP_TARGET "${{ matrix.image }}" sh -ec '
            if command -v apk >/dev/null; then apk add --no-cache build-base git; fi
            npm ci --ignore-scripts
            npm test
            node scripts/download-test-tgrep.cjs
            node --test test/integration.cjs
            node scripts/package.cjs
            node test/package.cjs
          '
      - uses: actions/upload-artifact@v4
        with:
          name: tgrep-search-${{ matrix.target }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 30
